name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release & Installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Compile Inno Setup Multi-Language Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $env:Path = "C:\Program Files (x86)\Inno Setup 6;C:\Program Files\Inno Setup 6;$env:Path"
          }
          & iscc installer.iss

      - name: SHA-256 Checksums
        shell: pwsh
        run: |
          $h1 = (Get-FileHash target/release/axolote_suite.exe -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash dist/Axolote_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h1  axolote_suite.exe`n$h2  Axolote_Setup.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Release Artifacts SHA-256"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- axolote_suite.exe: $h1"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Axolote_Setup.exe: $h2"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axolote_Setup-windows-x64
          path: |
            dist/Axolote_Setup.exe
            target/release/axolote_suite.exe
            SHA256SUMS.txt
