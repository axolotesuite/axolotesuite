[package]
name = "axolote_suite"
version = "1.3.0"
edition = "2021"
description = "Axolote Suite - Sua central offline de ferramentas de produtividade, edição de foto e vídeo, PDF, conversão e arquivos"
authors = ["Axolote"]
license = "MIT OR Apache-2.0"
keywords = ["desktop", "productivity", "utility", "windows", "iced"]
categories = ["gui"]
repository = "https://github.com/axolotesuite/axolotesuite"
homepage = "https://axolotesuite.github.io/axolotesuite/"
readme = "README.md"

[dependencies]
# Interface gráfica nativa com suporte a renderização de imagens (logos + preview de fotos)
iced = { version = "0.12", features = ["image"] }
# Diálogos nativos do Windows para escolher arquivos/pastas
rfd = "0.15"
# Processamento e edição de imagens
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "ico", "tiff", "webp"] }
# Arquivos ZIP
zip = "0.6"
walkdir = "2.4"
# PDF (unir / dividir / informações)
lopdf = "0.34"
# Persistência local (configurações, histórico, tarefas)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Detecção automática do idioma do sistema operacional
sys-locale = "0.3"
# Data/hora local para o histórico
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Entropia segura nativa para senhas criptográficas e identificadores
getrandom = "0.3"

[profile.release]
opt-level = 3
panic = "abort"
strip = true
